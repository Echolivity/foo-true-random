name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Create a GitHub release with this tag (e.g. v1.0.0) from the tested build. Leave empty for a plain build."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  core-linux:
    name: Portable core tests (Linux, GCC, ASan/UBSan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Version consistency (version.h vs CHANGELOG)
        run: bash scripts/check-version.sh
      - name: Release build + tests
        run: |
          g++ --version | head -1
          cmake -S . -B build-rel -DCMAKE_BUILD_TYPE=Release
          cmake --build build-rel -j
          ctest --test-dir build-rel --output-on-failure -V
      - name: Sanitizer build + tests
        run: |
          cmake -S . -B build-san -DCMAKE_BUILD_TYPE=Debug -DFTR_SANITIZE=ON
          cmake --build build-san -j
          ctest --test-dir build-san --output-on-failure

  windows:
    name: Windows x64 (MSVC) — tests, component build, package
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Toolchain versions
        shell: pwsh
        run: |
          msbuild -version
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property catalog_productDisplayVersion
          "Visual Studio: $vs"
          (Get-CimInstance Win32_Processor).Name
      - name: Fetch official foobar2000 SDK 2026-10-01
        shell: pwsh
        run: ./scripts/fetch-sdk.ps1
      - name: SDK facts used by this component
        shell: bash
        run: |
          cd external/foobar2000-sdk
          grep -n "remove_playlists\|playlist_reorder_items\|playlist_undo_backup\|playlist_insert_items(t_size" foobar2000/SDK/playlist.h
          grep -rn "reorder" pfc/*.h | grep -i "order\[\|p_order\|reorder_t\|//" | head -40
      - name: Portable tests (MSVC, includes real RDSEED/RDRAND test on this runner's CPU)
        shell: pwsh
        run: |
          cmake -S . -B build-tests -G "Visual Studio 17 2022" -A x64
          if ($LASTEXITCODE) { exit 1 }
          foreach ($cfg in "Debug", "Release") {
            cmake --build build-tests --config $cfg -- /m /nologo /v:minimal
            if ($LASTEXITCODE) { exit 1 }
            ctest --test-dir build-tests -C $cfg --output-on-failure -V
            if ($LASTEXITCODE) { exit 1 }
          }
      - name: Build component Debug|x64 and Release|x64
        shell: pwsh
        run: ./scripts/build.ps1 -SkipFetch
      - name: Inspect DLL
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $dumpbin = Get-ChildItem -Recurse "$vsPath\VC\Tools\MSVC" -Filter dumpbin.exe | Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          foreach ($cfg in "Debug", "Release") {
            "== $cfg"
            & $dumpbin.FullName /nologo /headers "build\x64\$cfg\foo_true_random.dll" | Select-String "machine"
            & $dumpbin.FullName /nologo /exports "build\x64\$cfg\foo_true_random.dll" | Select-String "foobar2000_get_interface"
            & $dumpbin.FullName /nologo /dependents "build\x64\$cfg\foo_true_random.dll"
          }
          # Ensure the Release DLL contains RDSEED/RDRAND only behind CPUID (sanity: opcodes present).
          & $dumpbin.FullName /nologo /disasm "build\x64\Release\foo_true_random.dll" | Select-String -Pattern "\b(rdseed|rdrand|cpuid)\b" | Select-Object -First 20
      - name: Build integration-test driver component (not shipped)
        shell: pwsh
        run: |
          msbuild foobar2000\foo_true_random\foo_true_random.vcxproj /m /nologo /v:minimal /p:Configuration=Release /p:Platform=x64 /p:FTR_ITEST=true
          if ($LASTEXITCODE) { exit 1 }
      - name: Integration test in real foobar2000 v2.26.3 x64 (portable, installs the packaged component)
        shell: pwsh
        run: ./scripts/integration-test.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: foo-true-random
          path: |
            dist/foo-true-random.fb2k-component
            build/x64/Release/foo_true_random.pdb

  release:
    name: Publish GitHub release (tags v*, or manual dispatch with release_tag)
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [core-linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: foo-true-random
          path: artifact
      - name: Release tag must match version.h and CHANGELOG
        run: |
          tag="${{ inputs.release_tag }}"
          if [ -z "$tag" ]; then tag="${GITHUB_REF_NAME}"; fi
          bash scripts/check-version.sh "$tag"
      - name: Create release with the verified package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pkg=$(find artifact -name foo-true-random.fb2k-component)
          sha256sum "$pkg"
          ( echo "Built and tested by GitHub Actions run ${{ github.run_id }} from commit ${{ github.sha }}."
            echo
            echo "SHA-256 of foo-true-random.fb2k-component: \`$(sha256sum "$pkg" | cut -d' ' -f1)\`"
            echo
            awk '/^## /{n++} n==1' CHANGELOG.md ) > notes.md
          tag="${{ inputs.release_tag }}"
          if [ -z "$tag" ]; then tag="${GITHUB_REF_NAME}"; fi
          # --target creates the tag at the exact commit that was just built and tested.
          # Tags with a suffix (e.g. v1.0.2-rc1) are published as pre-releases, so the
          # "latest release" link and badge keep pointing at the last stable version.
          pre=""; case "$tag" in *-*) pre="--prerelease";; esac
          gh release create "$tag" "$pkg" $pre --target "${GITHUB_SHA}" --title "foo-true-random $tag" --notes-file notes.md
