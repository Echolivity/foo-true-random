name: sdk-probe
on: push
jobs:
  probe:
    runs-on: windows-2022
    steps:
      - name: Fetch SDK
        shell: pwsh
        run: |
          Invoke-WebRequest -UseBasicParsing https://www.foobar2000.org/downloads/SDK-2026-10-01.7z -OutFile sdk.7z
          7z x sdk.7z -osdk | Out-Null
      - name: Dump
        shell: bash
        run: |
          cd sdk
          grep -n "void reorder(reorder_callback" -A30 pfc/sort.cpp || true
          grep -n "reorder_void" -A25 pfc/sort.cpp | head -40 || true
      - name: fb2k download page
        shell: pwsh
        run: |
          $p = Invoke-WebRequest -UseBasicParsing https://www.foobar2000.org/download
          $p.Links | ForEach-Object { $_.href } | Where-Object { $_ -match 'getfile|exe|zip|download' }
