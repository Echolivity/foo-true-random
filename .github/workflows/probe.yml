name: sdk-probe
on: push
jobs:
  probe:
    runs-on: windows-2022
    steps:
      - name: Fetch SDK
        shell: pwsh
        run: |
          Invoke-WebRequest -UseBasicParsing https://www.foobar2000.org/downloads/SDK-2026-10-01.7z -OutFile sdk.7z
          7z x sdk.7z -osdk | Out-Null
      - name: Dump
        shell: bash
        run: |
          cd sdk
          grep -n "handle_create\|class make_playable_location\|make_playable_location(" foobar2000/SDK/metadb.h foobar2000/SDK/playable_location.h | head -20
          grep -rn "inMainThread\|main_thread_callback_add\|callInMainThread" foobar2000/SDK/*.h | head -20
          grep -n "main_exit\|static.*run_main" foobar2000/SDK/menu_helpers.h foobar2000/SDK/*.h | head -10
          grep -n "class NOVTABLE initquit\|on_init\|on_quit\|class initquit" foobar2000/SDK/initquit.h
          grep -n "g_execute\|static bool g_find_by_name\|g_execute_dynamic" foobar2000/SDK/menu.h | head
          grep -n "playlist_undo_restore\|playlist_is_undo_available\|playlist_clear\|playlist_add_items\|activeplaylist_set_selection" foobar2000/SDK/playlist.h | head
          grep -rn "reorder" pfc/list.h pfc/sort.h pfc/primitives.h 2>/dev/null | head -30
          grep -n "sort_get_permutation" -A6 pfc/*.h | head -30
          echo ===== cmdline; grep -rn "runcmd\|/command:" foobar2000/SDK/*.h | head
      - name: fb2k download page
        shell: pwsh
        run: |
          $p = Invoke-WebRequest -UseBasicParsing https://www.foobar2000.org/download
          $p.Links | ForEach-Object { $_.href } | Where-Object { $_ -match 'getfile|exe|zip' }
